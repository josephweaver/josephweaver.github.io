title: Joseph Weaver Public Notebook
description: Research notes on probability, geospatial systems, Bayesian modeling, AI-assisted workflows, and systems design.
author: Joseph M. Weaver
url: "https://josephweaver.github.io"
repository: josephweaver/josephweaver.github.io
timezone: America/New_York

remote_theme: pages-themes/cayman@v0.2.0   # or: slate, minimal, hacker, leap-day
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-include-cache

# Navigation follows this directory, at any depth.
content_root: content

readme_index:
  with_frontmatter: true
  remove_originals: true

relative_links:
  enabled: true

titles_from_headings:
  enabled: true
  strip_title: false

# Optional analytics for the static GitHub Pages site.
# GitHub Pages cannot maintain a server-side hit counter by itself, so this
# layout hook sends page views to an external counter when configured.
#
# analytics:
#   goatcounter:
#     domain: josephweaver.goatcounter.com

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

exclude:
  - private/
  - vendor/
  - .bundle/
  - Gemfile.lock
  - Gemfile
  - scripts/
  - node_modules/
  # The Markdown source renders to this same filename.
  - content/notes/STT997/HW5.html

defaults:
  - scope:
      path: "content"
    values:
      layout: default
  - scope:
      path: "content/notes"
    values:
      math: true

giscus:
  repo: josephweaver/josephweaver.github.io
  repo_id: R_kgDOJRcmlg
  category: Page Discussions
  category_id: DIC_kwDOJRcmls4C0O8F
  mapping: pathname
  reactions_enabled: 1
  emit_metadata: 0
  input_position: bottom
  theme: light
  lang: en
  loading: lazy
